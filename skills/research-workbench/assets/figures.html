<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>文献图片库 · 科研工作台</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#203b43;background:#f4f7f7;font-size:15px;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{background:#173c45;color:#fff;padding:36px max(22px,calc((100vw - 1280px)/2))}header p{color:#d2e5e8;margin:7px 0}h1{font-size:28px;margin:0}h2{font-size:20px;margin:0}main{max-width:1324px;margin:auto;padding:24px 22px}button,input,select{font:inherit}a{color:#147a83;text-decoration:none}a:hover{text-decoration:underline}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e3a446;outline-offset:3px}.toolbar{background:white;border:1px solid #dce5e7;border-radius:13px;padding:18px}.search{width:100%;border:1px solid #bacfd3;border-radius:7px;padding:11px}.filters,.modes,.links,.stats{display:flex;gap:12px;flex-wrap:wrap}.filters{margin-top:13px}.filters label{font-size:13px;color:#506d75;display:flex;gap:6px;align-items:center}select{max-width:210px;border:1px solid #d0dfe1;background:#fff;border-radius:6px;padding:6px}.modes{margin:16px 0;align-items:center}.modes button,.close{border:1px solid #c8dadd;border-radius:7px;background:white;color:#28505a;padding:7px 16px}.modes button[aria-pressed=true]{background:#1c707a;color:white;border-color:#1c707a}.stats{margin:16px 0;color:#4e6972;font-size:13px}.count{margin-left:auto;color:#506a72;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:18px}.card,.paper{border:1px solid #dce5e7;border-radius:12px;background:white;overflow:hidden}.image-button{display:flex;align-items:center;justify-content:center;width:100%;height:212px;border:0;background:#fff;padding:14px;border-bottom:1px solid #edf1f2}.image-button:hover{background:#f0f8f8}.image-button img{width:100%;height:100%;object-fit:contain}.card-content{padding:16px}.id{font-size:12px;color:#6a8087}.caption{font-size:15px;margin:8px 0;overflow-wrap:anywhere}.paper-title{font-size:13px;color:#52717a;margin:7px 0}.badge{display:inline-block;font-size:12px;background:#edf5f5;color:#326a72;border-radius:5px;padding:2px 7px;margin:2px 6px 2px 0}.badge.wait{color:#886222;background:#fff5df}.summary{font-size:14px;color:#4e6770;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.links{font-size:13px;margin-top:12px;gap:10px}.paper{padding:20px;margin-bottom:20px}.paper>.grid{margin-top:18px}.muted{font-size:13px;color:#637e85}.empty{padding:48px 20px;text-align:center;background:white;border:1px dashed #b8ced2;border-radius:12px}.notice{font-size:13px;color:#607b83;margin:24px 0}dialog{width:min(1120px,95vw);max-height:94vh;border:1px solid #b9d1d6;border-radius:13px;padding:0;color:#203b43}dialog::backdrop{background:#13343dd0}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:16px 20px;border-bottom:1px solid #dfe9eb;position:sticky;top:0;background:white}.dialog-body{padding:20px}.large{display:block;width:auto;height:auto;max-width:100%;max-height:65vh;object-fit:contain;margin:auto}.detail{margin-top:16px;padding-top:12px;border-top:1px solid #e1ebed}.detail p{white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:12px;color:#6b8188;padding:10px 0 25px}@media(max-width:600px){header{padding:25px 18px}h1{font-size:24px}main{padding:16px 12px}.grid{grid-template-columns:1fr}.toolbar{padding:13px}.filters{gap:8px}.filters label{width:100%;justify-content:space-between}.filters select{max-width:70%;width:70%}.count{margin-left:0;width:100%}.paper{padding:13px}.dialog-body{padding:13px}.image-button{height:240px}}
</style></head><body>
<header><h1>文献图片库</h1><p>从原图到可追溯的参考资料</p><p id="headline"></p></header>
<main><section class="toolbar" aria-label="图片检索与筛选"><input id="search" class="search" type="search" aria-label="搜索文献和图片" placeholder="搜索题名、作者、文献 ID、图注或中文说明">
<div class="filters"><label>板块<select id="section" aria-label="研究板块"></select></label><label>图型<select id="category" aria-label="图像类型"></select></label><label>年份<select id="year" aria-label="发表年份"></select></label><label>核验<select id="review" aria-label="核验状态"><option value="">全部状态</option><option value="needs_review">待核验</option><option value="human">人工已复核</option><option value="ai">AI 已复核</option></select></label></div></section>
<div class="modes"><button id="by-figure" aria-pressed="true">按图浏览</button><button id="by-paper" aria-pressed="false">按文献浏览</button><button id="reset">清除筛选</button><span id="count" class="count" aria-live="polite"></span></div>
<div id="results"></div><p class="notice">中文解读和用途说明由人工或 Codex 填写。图像复核与文献阅读分开记录；自动候选不代表已完整覆盖。裁切 PDF 可能保留显示区域外内容，不能作为脱敏文件。</p><footer id="footer"></footer></main>
<dialog id="viewer"><div class="dialog-head"><strong id="viewer-title"></strong><button class="close" id="close" aria-label="关闭大图">关闭</button></div><div id="viewer-body" class="dialog-body"></div></dialog>
<script type="application/json" id="figure-data">__FIGURE_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("figure-data").textContent);
const el=id=>document.getElementById(id),papers=data.papers;
const rows=papers.flatMap(p=>p.figures.map(f=>({p,f})));
let mode="figure";
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function link(url,label){if(!url)return node("span",label);const a=node("a",label);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a;}
function review(f){return f.review==="verified"?(f.review_method==="human"?"人工已复核":"AI 已复核"):"待核验";}
function links(p,f){const n=node("div",undefined,"links");n.append(link(f.assets.png,"PNG"),link(f.assets.pdf,"裁切 PDF"));if(p.source_url)n.append(link(p.source_url+(f.pages.length?"#page="+f.pages[0]:""),"原 PDF"));if(p.note_url)n.append(link(p.note_url,"文字笔记"));return n;}
function badge(text,wait=false){return node("span",text,"badge"+(wait?" wait":""));}
function detail(title,text){const n=node("section",undefined,"detail");n.append(node("strong",title),node("p",text||"尚未填写"));return n;}
function show(p,f){el("viewer-title").textContent=f.id+" · 图 "+f.number;const body=el("viewer-body");body.replaceChildren();const img=node("img",undefined,"large");img.src=f.assets.png;img.alt=f.caption;body.append(img,node("p",f.caption),links(p,f));body.append(detail("图意说明",f.summary),detail("参考用途（整理建议）",f.use),detail("适用限制",f.limitation));const source=node("section",undefined,"detail");source.append(node("strong","来源与分段"),node("p","原 PDF 页序："+f.pages.join("、")+"；"+review(f)));f.segments.forEach((s,i)=>{const line=node("div",undefined,"links");line.append(node("span","分段 "+(i+1)+" · 第 "+s.page+" 页"),link(s.source_url,"原页"));if(s.assets.png)line.append(link(s.assets.png,"分段 PNG"));if(s.assets.pdf)line.append(link(s.assets.pdf,"分段 PDF"));source.append(line);});body.append(source);el("viewer").showModal();}
function card(p,f){const n=node("article",undefined,"card"),button=node("button",undefined,"image-button"),img=node("img");button.type="button";button.setAttribute("aria-label","放大 "+f.id);img.src=f.assets.thumbnail||f.assets.png;img.alt=f.caption;img.loading="lazy";button.append(img);button.addEventListener("click",()=>show(p,f));const body=node("div",undefined,"card-content");body.append(node("div",f.id,"id"),node("h3",f.caption,"caption"),node("p",p.title,"paper-title"));const badges=node("div");badges.append(badge(f.category),badge(review(f),f.review!=="verified"));body.append(badges);if(f.summary)body.append(node("p",f.summary,"summary"));body.append(links(p,f));n.append(button,body);return n;}
function options(id,values,label){const target=el(id);target.append(node("option",label));target.firstChild.value="";Array.from(new Set(values)).sort((a,b)=>String(a).localeCompare(String(b),"zh-CN")).forEach(v=>{const o=node("option",v);o.value=v;target.append(o);});}
function selected(){const q=el("search").value.trim().toLocaleLowerCase(),s=el("section").value,c=el("category").value,y=el("year").value,r=el("review").value;return rows.filter(({p,f})=>(!s||p.section===s)&&(!c||f.category===c)&&(!y||p.year===y)&&(!r||(r==="needs_review"?f.review==="needs_review":f.review==="verified"&&f.review_method===r))&&(!q||[p.id,p.title,p.authors,p.year,p.tags.join(" "),f.id,f.caption,f.summary,f.use,f.limitation].join(" ").toLocaleLowerCase().includes(q)));}
function emptyPaperMatches(p){const q=el("search").value.trim().toLocaleLowerCase(),s=el("section").value,y=el("year").value,r=el("review").value;return !p.figures.length&&(!s||p.section===s)&&(!y||p.year===y)&&!el("category").value&&(!r||r==="needs_review")&&(!q||[p.id,p.title,p.authors,p.tags.join(" ")].join(" ").toLocaleLowerCase().includes(q));}
function paperMatches(p){const q=el("search").value.trim().toLocaleLowerCase();return (!el("section").value||p.section===el("section").value)&&(!el("year").value||p.year===el("year").value)&&!el("category").value&&(!el("review").value||el("review").value==="needs_review")&&(!q||[p.id,p.title,p.authors,p.tags.join(" ")].join(" ").toLocaleLowerCase().includes(q));}
function pendingPaper(p){const n=node("div",undefined,"empty");n.append(node("strong",p.id+" · "+p.title),node("p","尚未定位正式图；请查看原页校对图并补充裁切范围，不能据此认定原文无图。"));const l=node("div",undefined,"links");l.append(link(p.source_url,"原 PDF"),link(p.manifest_url,"逐篇图目"));(p.proofs||[]).forEach(proof=>l.append(link(proof.url,"校对第 "+proof.page+" 页")));n.append(l);return n;}
function render(){const found=selected(),out=el("results"),pending=papers.filter(p=>!p.figures.length&&paperMatches(p));out.replaceChildren();el("count").textContent=found.length+" 幅图 · "+new Set(found.map(x=>x.p.id)).size+" 篇含图文献"+(pending.length?" · "+pending.length+" 篇待定位":"");el("by-figure").setAttribute("aria-pressed",String(mode==="figure"));el("by-paper").setAttribute("aria-pressed",String(mode==="paper"));if(!found.length&&!pending.length){out.append(node("div","没有符合条件的图片。请调整搜索词或清除筛选。","empty"));return;}if(mode==="figure"){const grid=node("div",undefined,"grid");found.forEach(({p,f})=>grid.append(card(p,f)));out.append(grid);pending.forEach(p=>out.append(pendingPaper(p)));}else{papers.forEach(p=>{const fs=found.filter(x=>x.p.id===p.id);if(!fs.length){if(pending.includes(p))out.append(pendingPaper(p));return;}const section=node("section",undefined,"paper"),grid=node("div",undefined,"grid");section.append(node("h2",p.title),node("p",p.id+" · "+p.authors+" · "+p.year+" · "+p.section,"muted"),link(p.manifest_url,"逐篇图目与核验记录"));fs.forEach(({f})=>grid.append(card(p,f)));section.append(grid);out.append(section);});}}

options("section",papers.map(p=>p.section),"全部板块");options("category",rows.map(x=>x.f.category),"全部图型");options("year",papers.map(p=>p.year),"全部年份");
el("headline").textContent=data.counts.papers+" 篇文献 · "+data.counts.figures+" 幅正式图 · "+data.counts.needs_review+" 幅待核验";el("footer").textContent="离线快照 · 生成于 "+data.generated+" · 修改清单后请重新生成";
["search","section","category","year","review"].forEach(id=>el(id).addEventListener(id==="search"?"input":"change",render));el("by-figure").addEventListener("click",()=>{mode="figure";render();});el("by-paper").addEventListener("click",()=>{mode="paper";render();});el("reset").addEventListener("click",()=>{["search","section","category","year","review"].forEach(id=>el(id).value="");render();});el("close").addEventListener("click",()=>el("viewer").close());render();
</script></body></html>
