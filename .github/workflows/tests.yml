name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # UTC 01:17 = 北京时间 09:17；GitHub 调度可能延迟。
    - cron: '17 1 * * *'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 固定 Linux 大版本，避免 latest 自动迁移改变验证环境。
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/check_public_tree.py
      # 从当前提交打包，运行临时安装副本，验证用户下载源码包后的流程。
      - name: Verify distribution archive and isolated installation
        run: python -X utf8 scripts/verify_distribution.py --ref HEAD
