name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # UTC 01:17 = 北京时间 09:17；GitHub 调度可能延迟。
    - cron: '17 1 * * *'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 固定 Linux 大版本，避免 latest 自动迁移改变验证环境。
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0 (Node 24)
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/check_public_tree.py
      # 从当前提交打包，运行临时安装副本，验证用户下载源码包后的流程。
      - name: Verify distribution archive and isolated installation
        run: python -X utf8 scripts/verify_distribution.py --ref HEAD
      # 先证明核心流程不需 PDF 依赖，再验证可选图库和安装副本。
      - name: Install optional figure dependencies
        run: python -m pip install -r skills/research-workbench/requirements-figures.txt
      - name: Test optional figure pipeline
        run: python -X utf8 -m unittest discover -s tests -p "test_figure*.py" -v
      - name: Verify installed figure tools from committed archive
        run: python -X utf8 scripts/verify_distribution.py --ref HEAD --figures
